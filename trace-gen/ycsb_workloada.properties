# YCSB Workload A (50% reads, 50% updates). The generation script supplies
# record count, operation count, Zipfian theta, and grouped-transaction size.
workload=core
readallfields=true
writeallfields=false
readproportion=0.5
updateproportion=0.5
insertproportion=0
scanproportion=0
readmodifywriteproportion=0
fieldcount=10
fieldlength=100
insertorder=hashed
requestdistribution=zipfian
