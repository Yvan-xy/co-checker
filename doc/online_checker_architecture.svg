<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120"
     viewBox="0 0 1800 1120" role="img"
     aria-labelledby="title description">
  <title id="title">Low-overhead embedded online consistency checker architecture</title>
  <desc id="description">
    Database-native hooks record events in a transaction-local buffer. At a
    successful commit, one immutable transaction batch crosses a stable C ABI
    into an in-process MPSC queue. A dedicated C++ checker thread reorders
    complete transactions through an authoritative commit-order frontier and
    active start-token guard, then feeds a stateful SnapshotSOWW engine. Optional
    shared-memory, socket, and offline transports use the same transaction-batch
    contract and C++ core.
  </desc>

  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="native-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cpp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7"
                    flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10"
            refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10"
            refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-control" markerWidth="12" markerHeight="12" refX="10"
            refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#d97706"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; font-style: normal; }
      .title { font-size: 38px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 19px; font-weight: 400; fill: #475569; }
      .process-title { font-size: 23px; font-weight: 700; fill: #ffffff; }
      .process-note { font-size: 16px; font-weight: 500; fill: #cbd5e1; }
      .zone-title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .zone-note { font-size: 15px; font-weight: 500; fill: #475569; }
      .box-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box-body { font-size: 15px; font-weight: 400; fill: #334155; }
      .box-body-small { font-size: 14px; font-weight: 400; fill: #334155; }
      .label { font-size: 14px; font-weight: 650; fill: #334155; }
      .label-blue { font-size: 14px; font-weight: 700; fill: #1d4ed8; }
      .label-control { font-size: 14px; font-weight: 700; fill: #b45309; }
      .number { font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .pill-title { font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .pill-note { font-size: 13px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .footer-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .footer-note { font-size: 15px; font-weight: 400; fill: #475569; }
      .flow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 3.5; marker-end: url(#arrow-blue); }
      .control { fill: none; stroke: #d97706; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-control); }
      .optional { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#f8fafc"/>

  <text x="54" y="55" class="title">Low-overhead online SOWW checker</text>
  <text x="54" y="89" class="subtitle">
    Native per-transaction capture · one ABI submission per committed transaction · asynchronous C++ checking
  </text>

  <!-- Recommended embedded deployment: one process and one address space. -->
  <rect x="40" y="125" width="1720" height="725" rx="25"
        fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <path d="M65 125 H1735 A25 25 0 0 1 1760 150 V190 H40 V150 A25 25 0 0 1 65 125 Z"
        fill="#0f172a"/>
  <text x="70" y="164" class="process-title">DATABASE PROCESS — SAME ADDRESS SPACE</text>
  <text x="1718" y="164" text-anchor="end" class="process-note">
    default embedded deployment · no IPC
  </text>

  <!-- Native capture zone. -->
  <rect x="70" y="215" width="600" height="600" rx="22"
        fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="100" y="255" class="zone-title">Database-native capture</text>
  <text x="100" y="280" class="zone-note">Go for TiDB · C for PostgreSQL · native adapter elsewhere</text>

  <rect x="105" y="315" width="225" height="190" rx="17"
        fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="130" cy="340" r="15" fill="#2563eb"/>
  <text x="130" y="345" class="number">1</text>
  <text x="155" y="346" class="box-title">DB execution hooks</text>
  <text x="130" y="382" class="box-body">
    <tspan x="130" dy="0">• point / batch / scan reads</tspan>
    <tspan x="130" dy="25">• writes and deletes</tspan>
    <tspan x="130" dy="25">• savepoint / retry scope</tspan>
    <tspan x="130" dy="25">• commit / abort outcome</tspan>
  </text>

  <rect x="390" y="315" width="235" height="190" rx="17"
        fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="415" cy="340" r="15" fill="#2563eb"/>
  <text x="415" y="345" class="number">2</text>
  <text x="440" y="346" class="box-title">Transaction recorder</text>
  <text x="415" y="382" class="box-body">
    <tspan x="415" dy="0">Present(bytes) / Absent</tspan>
    <tspan x="415" dy="25">user snapshot reads only</tspan>
    <tspan x="415" dy="25">unique session + attempt ID</tspan>
    <tspan x="415" dy="25">compact descriptor + byte arena</tspan>
  </text>

  <path d="M330 485 H390" class="flow-blue"/>
  <rect x="318" y="468" width="114" height="23" rx="11" fill="#dbeafe"/>
  <text x="375" y="484" text-anchor="middle" class="label-blue">per event · native</text>

  <rect x="105" y="605" width="225" height="108" rx="16"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.7"/>
  <text x="130" y="637" class="box-title">Abort / rollback</text>
  <text x="130" y="670" class="box-body-small">
    <tspan x="130" dy="0">discard failed transaction</tspan>
    <tspan x="130" dy="22">never publish a partial batch</tspan>
  </text>
  <path d="M218 505 V605" class="optional"/>

  <rect x="390" y="570" width="235" height="175" rx="17"
        fill="#ffffff" stroke="#3b82f6" stroke-width="2.4" filter="url(#shadow)"/>
  <circle cx="415" cy="595" r="15" fill="#2563eb"/>
  <text x="415" y="600" class="number">3</text>
  <text x="440" y="601" class="box-title">Finalize on success</text>
  <text x="415" y="637" class="box-body">
    <tspan x="415" dy="0">complete external read set</tspan>
    <tspan x="415" dy="25">final write / delete per key</tspan>
    <tspan x="415" dy="25">commit token + producer seq</tspan>
    <tspan x="415" dy="25">immutable TxnBatch</tspan>
  </text>
  <path d="M507 505 V570" class="flow-blue"/>

  <!-- Embedded C++ zone. -->
  <rect x="720" y="215" width="1010" height="600" rx="22"
        fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="750" y="255" class="zone-title">Embedded C++ runtime</text>
  <text x="750" y="280" class="zone-note">bounded handoff · one deterministic consumer · checker stays off the DB worker thread</text>

  <rect x="760" y="315" width="205" height="138" rx="16"
        fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="785" y="347" class="box-title" fill="#9a3412">Fast-path contract</text>
  <text x="785" y="379" class="box-body-small">
    <tspan x="785" dy="0">No per-event FFI or IPC</tspan>
    <tspan x="785" dy="24">Commit thread: enqueue only</tspan>
  </text>

  <rect x="1010" y="315" width="225" height="138" rx="16"
        fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="1035" y="347" class="box-title">Closed frontier W</text>
  <text x="1035" y="379" class="box-body-small">
    <tspan x="1035" dy="0">authoritative resolved time</tspan>
    <tspan x="1035" dy="22">active start-token guard</tspan>
    <tspan x="1035" dy="22">not max-seen / timeout</tspan>
  </text>

  <rect x="1280" y="315" width="420" height="138" rx="16"
        fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="1305" y="347" class="box-title">Coverage defines the strength of the claim</text>
  <text x="1305" y="379" class="box-body-small">
    <tspan x="1305" dy="0">All in-scope user-event producers</tspan>
    <tspan x="1305" dy="22">plus one authoritative frontier.</tspan>
    <tspan x="1305" dy="22">Loss, malformed input, or unsupported path</tspan>
    <tspan x="1305" dy="22">⇒ fatal EngineError; never Pass.</tspan>
  </text>

  <!-- Stable ABI crossing and main async data flow. -->
  <path d="M625 658 H770" class="flow-blue"/>
  <rect x="649" y="613" width="99" height="73" rx="14"
        fill="#ede9fe" stroke="#8b5cf6" stroke-width="2.3" filter="url(#shadow)"/>
  <text x="698" y="638" text-anchor="middle" class="label" fill="#5b21b6">stable C ABI</text>
  <text x="698" y="661" text-anchor="middle" class="label" fill="#5b21b6">1× / txn</text>
  <text x="698" y="681" text-anchor="middle" class="box-body-small" fill="#6d28d9">same process</text>
  <rect x="604" y="531" width="210" height="29" rx="14" fill="#dbeafe"/>
  <text x="709" y="551" text-anchor="middle" class="label-blue">one complete transaction batch</text>

  <rect x="770" y="570" width="190" height="175" rx="17"
        fill="#ffffff" stroke="#10b981" stroke-width="2.3" filter="url(#shadow)"/>
  <circle cx="795" cy="595" r="15" fill="#059669"/>
  <text x="795" y="600" class="number">4</text>
  <text x="820" y="601" class="box-title">MPSC queue</text>
  <text x="795" y="637" class="box-body">
    <tspan x="795" dy="0">many DB producers</tspan>
    <tspan x="795" dy="25">owned batch memory</tspan>
    <tspan x="795" dy="25">lossless producer seq</tspan>
    <tspan x="795" dy="25">bounded backpressure</tspan>
  </text>

  <rect x="1010" y="535" width="225" height="235" rx="17"
        fill="#ffffff" stroke="#10b981" stroke-width="2.3" filter="url(#shadow)"/>
  <circle cx="1035" cy="560" r="15" fill="#059669"/>
  <text x="1035" y="565" class="number">5</text>
  <text x="1060" y="566" class="box-title">Commit-order gate</text>
  <text x="1035" y="604" class="box-body">
    <tspan x="1035" dy="0">heap by order token</tspan>
    <tspan x="1035" dy="25">release token &lt;= W</tspan>
    <tspan x="1035" dy="25">active start-token guard</tspan>
    <tspan x="1035" dy="25">reject loss / late / duplicate</tspan>
    <tspan x="1035" dy="25">assign CommitSeq</tspan>
  </text>

  <rect x="1280" y="515" width="235" height="270" rx="17"
        fill="#ffffff" stroke="#059669" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="1305" cy="540" r="15" fill="#047857"/>
  <text x="1305" y="545" class="number">6</text>
  <text x="1330" y="546" class="box-title">Snapshot SOWW engine</text>
  <text x="1305" y="584" class="box-body">
    <tspan x="1305" dy="0">SO lower bound</tspan>
    <tspan x="1305" dy="25">WW lower bound</tspan>
    <tspan x="1305" dy="25">single-snapshot read match</tspan>
  </text>
  <line x1="1305" y1="667" x2="1490" y2="667" stroke="#a7f3d0" stroke-width="2"/>
  <text x="1305" y="696" class="label">Retained state</text>
  <text x="1305" y="721" class="box-body-small">
    <tspan x="1305" dy="0">snapshot · last session txn</tspan>
    <tspan x="1305" dy="22">last writer · exact value history</tspan>
  </text>

  <rect x="1555" y="550" width="150" height="205" rx="17"
        fill="#ffffff" stroke="#64748b" stroke-width="2.2" filter="url(#shadow)"/>
  <circle cx="1580" cy="575" r="15" fill="#475569"/>
  <text x="1580" y="580" class="number">7</text>
  <text x="1605" y="581" class="box-title">Result</text>
  <text x="1580" y="619" class="box-body-small">
    <tspan x="1580" dy="0" fill="#047857">Pass</tspan>
    <tspan x="1580" dy="38" fill="#b91c1c">Violation(T)</tspan>
    <tspan x="1580" dy="22" fill="#b91c1c">+ witness</tspan>
  </text>

  <path d="M960 658 H1010" class="flow"/>
  <path d="M1235 658 H1280" class="flow"/>
  <rect x="1227" y="621" width="66" height="24" rx="12" fill="#d1fae5"/>
  <text x="1260" y="638" text-anchor="middle" class="label">≤ W</text>
  <path d="M1515 658 H1555" class="flow"/>
  <path d="M1122 453 V535" class="control"/>
  <rect x="1137" y="472" width="105" height="24" rx="12" fill="#fef3c7"/>
  <text x="1189" y="489" text-anchor="middle" class="label-control">frontier / active</text>

  <!-- Optional deployment backends. -->
  <rect x="40" y="880" width="1720" height="200" rx="23"
        fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="70" y="919" class="footer-title">Pluggable deployment backends</text>
  <text x="70" y="946" class="footer-note">
    Choose one transport. Every mode carries the same TxnBatch/control schema into the same ordering stage and C++ checker core.
  </text>

  <rect x="100" y="970" width="360" height="82" rx="16"
        fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="280" y="1001" class="pill-title">Embedded C ABI + memory queue</text>
  <text x="280" y="1027" class="pill-note">recommended first · lowest overhead · no IPC</text>

  <rect x="500" y="970" width="360" height="82" rx="16"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="680" y="1001" class="pill-title">Shared-memory sidecar</text>
  <text x="680" y="1027" class="pill-note">process isolation with a memory transport</text>

  <rect x="900" y="970" width="360" height="82" rx="16"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1080" y="1001" class="pill-title">Socket daemon / cluster aggregator</text>
  <text x="1080" y="1027" class="pill-note">global multi-node collection when required</text>

  <rect x="1300" y="970" width="360" height="82" rx="16"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1480" y="1001" class="pill-title">Binary trace / offline replay</text>
  <text x="1480" y="1027" class="pill-note">deterministic debugging and differential tests</text>

  <line x1="70" y1="1098" x2="112" y2="1098" stroke="#334155" stroke-width="3"/>
  <text x="122" y="1103" class="footer-note">transaction data</text>
  <line x1="280" y1="1098" x2="322" y2="1098" stroke="#d97706" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="332" y="1103" class="footer-note">ordering / runtime control</text>
  <text x="1745" y="1103" text-anchor="end" class="footer-note">
    Snapshot begin unknown → compatibility with a legal snapshot, not identification of the actual snapshot
  </text>
</svg>
